name: CI

on:
  push:
    branches:
      - main
      - master
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_DB: digestbot
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d digestbot"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=10

    env:
      DATABASE_URL: postgresql+asyncpg://postgres:postgres@localhost:5432/digestbot
      TELEGRAM_BOT_TOKEN: test-token
      LLM_BASE_URL: http://localhost:11434/v1
      LLM_API_KEY: ""
      LLM_MODEL: mock
      TRANSCRIPTION_MODE: mock
      BOT_MODE: polling
      WEBHOOK_URL: ""
      BOT_USERNAME: test_bot

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install -e .

      - name: Run tests
        run: pytest -q

